name: Build AriaScore APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode & Rebuild with Apktool
        run: |
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          
          # 反编译原 APK
          apktool d AriaScore_v22.0.apk -o app_src
          
          # 如果仓库里有修改好的 index.html 和图标，自动覆盖进去
          cp -f index.html app_src/assets/index.html || true
          
          # 重新打包
          apktool b app_src -o AriaScore_Unsigned.apk

      - name: Sign APK
        run: |
          # 生成临时签名密钥并自动签名
          keytool -genkey -v -keystore release.keystore -alias ariascore -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=AriaScore Studio, O=AriaScore, C=CN"
          $ANDROID_HOME/build-tools/*/apksigner sign --ks release.keystore --ks-pass pass:123456 --out AriaScore_v23.0_Optimized.apk AriaScore_Unsigned.apk

      - name: Upload APK to Artifacts (云端产物下载)
        uses: actions/upload-artifact@v4
        with:
          name: AriaScore_v23.0_Optimized
          path: AriaScore_v23.0_Optimized.apk
